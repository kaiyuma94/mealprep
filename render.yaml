# Render Blueprint: deploys Weekmenu as a free static site.
# In Render: New → Blueprint → pick this repo.
services:
  - type: web
    runtime: static
    name: weekmenu
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
    routes:
      # Client-side routing: serve the app for every path (e.g. /recipe/...).
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Let phones pick up new versions instead of caching the service worker.
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
